# /etc/nginx/sites-available/sophiya
# 1. Redirect www -> non-www
server {
    server_name www.xn----ctbjn3arftl7c8b.xn--p1ai;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    return 301 https://xn----ctbjn3arftl7c8b.xn--p1ai$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/xn----ctbjn3arftl7c8b.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----ctbjn3arftl7c8b.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# 2. Main HTTPS Server
server {
    server_name xn----ctbjn3arftl7c8b.xn--p1ai;

    root /var/www/sophiya;
    index index.html;

    client_max_body_size 25M;
    merge_slashes off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://yandex.ru https://*.yandex.ru https://*.yandex.net https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://xn----ctbjn3arftl7c8b.xn--p1ai https://*.yandex.ru https://*.yandex.net; frame-src 'self' https://yandex.ru https://*.yandex.ru; frame-ancestors 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self';" always;

    if ($request_uri ~* "^([^?]*)//+(.*)$") {
        return 301 $1/$2;
    }

    if ($request_uri ~* "^(.*/)index\.html(\?.*)?$") {
        return 301 $1;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25M;
    }

    location /bouquets-cloud/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/xn----ctbjn3arftl7c8b.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----ctbjn3arftl7c8b.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = xn----ctbjn3arftl7c8b.xn--p1ai) {
        return 301 https://$host$request_uri;
    }

    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xn----ctbjn3arftl7c8b.xn--p1ai 194.67.110.156 _;
    return 404;
}

server {
    if ($host = www.xn----ctbjn3arftl7c8b.xn--p1ai) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name www.xn----ctbjn3arftl7c8b.xn--p1ai;
    return 404;
}
