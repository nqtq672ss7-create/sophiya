# /etc/nginx/conf.d/sophiya-hardening.conf
server_tokens off;

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/manifest+json
  application/xml
  text/xml
  image/svg+xml;
