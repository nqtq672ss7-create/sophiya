<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Салон цветов «София»</title>
    <script>
      (function() {
        var path = window.location.pathname.toLowerCase().replace(/\/+$/, '');
        var hash = window.location.hash;
        var search = window.location.search;
        if (path.endsWith('/admin') || path.endsWith('/crm')) {
          window.location.replace('/#admin');
        } else {
          window.location.replace('/' + search + hash);
        }
      })();
    </script>
  </head>
  <body style="background: #140506; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0;">
    <div style="text-align: center;">
      <p style="font-size: 16px; letter-spacing: 0.1em; color: #C5A880;">Салон цветов «София»</p>
      <p style="font-size: 13px; color: rgba(255,255,255,0.6);">Загрузка страницы...</p>
    </div>
  </body>
</html>
