name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API security tests
        run: npm run test:api

      - name: Build project
        run: npm run build

      - name: Deploy to VPS via rsync
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '194.67.110.156' }}
          YOOKASSA_SHOP_ID: ${{ secrets.YOOKASSA_SHOP_ID }}
          YOOKASSA_SECRET_KEY: ${{ secrets.YOOKASSA_SECRET_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          TARGET_HOST="${VPS_HOST:-194.67.110.156}"
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete --exclude='bouquets-cloud/' -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" dist/ "root@$TARGET_HOST:/var/www/sophiya/"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new server/server.mjs server/yookassa-handler.mjs server/customer-auth-handler.mjs server/migrate-catalog-images.mjs "root@$TARGET_HOST:/opt/sophiya-api/"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new server/nginx-hardening.conf "root@$TARGET_HOST:/etc/nginx/conf.d/sophiya-hardening.conf"
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new server/nginx-sophiya.conf "root@$TARGET_HOST:/etc/nginx/sites-available/sophiya"
          node -e '
            process.stdout.write(JSON.stringify({
              NODE_ENV: "production",
              YOOKASSA_SHOP_ID: process.env.YOOKASSA_SHOP_ID || "",
              YOOKASSA_SECRET_KEY: process.env.YOOKASSA_SECRET_KEY || "",
              YOOKASSA_SEND_RECEIPT: "true"
            }));
          ' | ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new "root@$TARGET_HOST" 'node -e '\''
            const fs = require("fs");
            const nl = String.fromCharCode(10);
            const updates = JSON.parse(fs.readFileSync(0, "utf8"));
            const p = "/opt/sophiya-api/.env";
            let content = fs.existsSync(p) ? fs.readFileSync(p, "utf8") : "";
            const setVar = (k, v) => {
              if (!v) return;
              const re = new RegExp("^" + k + "=.*$", "m");
              content = re.test(content) ? content.replace(re, k + "=" + v) : content.trimEnd() + nl + k + "=" + v + nl;
            };
            setVar("NODE_ENV", updates.NODE_ENV);
            if (updates.YOOKASSA_SHOP_ID && updates.YOOKASSA_SECRET_KEY) {
              setVar("YOOKASSA_SHOP_ID", updates.YOOKASSA_SHOP_ID);
              setVar("YOOKASSA_SECRET_KEY", updates.YOOKASSA_SECRET_KEY);
              setVar("YOOKASSA_SEND_RECEIPT", updates.YOOKASSA_SEND_RECEIPT);
            }
            fs.writeFileSync(p, content.trimStart(), { mode: 0o600 });
            fs.chmodSync(p, 0o600);
          '\'''
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new "root@$TARGET_HOST" "nginx -t && systemctl reload nginx && pm2 restart sophiya-api --update-env && sleep 2 && curl -fsS http://127.0.0.1:3001/api/health && curl -fsS http://127.0.0.1:3001/api/yookassa"
