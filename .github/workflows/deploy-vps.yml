name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to VPS via rsync
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST || '194.67.110.156' }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          TARGET_HOST="${VPS_HOST:-194.67.110.156}"
          ssh-keyscan -H "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz --delete --exclude='bouquets-cloud/' -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new" dist/ root@$TARGET_HOST:/var/www/sophiya/
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new api/yookassa.ts root@$TARGET_HOST:/tmp/yookassa.ts
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new root@$TARGET_HOST "ls -la /opt/sophiya-api && wc -l /opt/sophiya-api/server.mjs && sed -n '1,120p' /opt/sophiya-api/server.mjs"
